name: Deploy to Firebase Hosting on PR
'on': pull_request
jobs:
  build_and_preview:
    if: '${{ github.event.pull_request.head.repo.full_name == github.repository }}'
    runs-on: ubuntu-latest
    # action-hosting-deploy 는 커밋에 체크런을 만들고 프리뷰 URL 을 PR 코멘트로 남긴다.
    # permissions 블록이 없으면 repoToken 이 읽기전용으로 내려와
    # POST /check-runs 가 "Resource not accessible by integration" (403) 으로 실패한다.
    permissions:
      checks: write # 체크런 생성 — 실제 403 이 나는 지점
      contents: read # actions/checkout
      pull-requests: write # 프리뷰 URL 코멘트
    steps:
      - uses: actions/checkout@v3
      - name: Generate Environment Variables File for Production
        run: |
          echo "VITE_API_KEY=$VITE_API_KEY" >> .env
          echo "VITE_AUTH_DOMAIN=$VITE_AUTH_DOMAIN" >> .env
          echo "VITE_PROJECT_ID=$VITE_PROJECT_ID" >> .env
          echo "VITE_STORAGE_BUCKET=$VITE_STORAGE_BUCKET" >> .env
          echo "VITE_MESSAGING_SENDER_ID=$VITE_MESSAGING_SENDER_ID" >> .env
          echo "VITE_APP_ID=$VITE_APP_ID" >> .env
          echo "VITE_MEASUREMENT_ID=$VITE_MEASUREMENT_ID" >> .env
        env:
          VITE_API_KEY: ${{ secrets.VITE_API_KEY }}
          VITE_AUTH_DOMAIN: ${{ secrets.VITE_AUTH_DOMAIN }}
          VITE_PROJECT_ID: ${{ secrets.VITE_PROJECT_ID }}
          VITE_STORAGE_BUCKET: ${{ secrets.VITE_STORAGE_BUCKET }}
          VITE_MESSAGING_SENDER_ID: ${{ secrets.VITE_MESSAGING_SENDER_ID }}
          VITE_APP_ID: ${{ secrets.VITE_APP_ID }}
          VITE_MEASUREMENT_ID: ${{ secrets.VITE_MEASUREMENT_ID }}
      - run: yarn && yarn build
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_NAMSAN_801DE }}'
          projectId: namsan-801de
